<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hammad Iqbal, Full-Stack and CRM Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="o1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.75"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.65"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A5F3FC"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .o { animation: drift 14s ease-in-out infinite alternate; }
    .o2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    .cmd { font: 600 16px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; fill: #67E8F9; }
    .out { font: 15px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; fill: #E2E8F0; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .o, .cur { animation: none; opacity: 1; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="o" cx="180" cy="60" r="220" fill="url(#o1)"/>
    <circle class="o o2" cx="980" cy="300" r="260" fill="url(#o2)"/>
    <path d="M0 0H1200" stroke="#fff" stroke-opacity="0.08"/>
  </g>
  <text x="64" y="132" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#C7D2FE" letter-spacing="3">HI, I'M</text>
  <text x="64" y="190" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#txt)">Hammad Iqbal</text>
  <text x="64" y="232" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#E0E7FF">Full-Stack &amp; CRM Developer</text>
  <text x="64" y="264" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#A5B4FC">Laravel · Next.js · React · Node · business automation</text>
  <!-- glass terminal -->
  <rect x="530" y="50" width="610" height="242" rx="16" fill="#0B1020" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle cx="556" cy="74" r="6" fill="#FF5F57"/><circle cx="576" cy="74" r="6" fill="#FEBC2E"/><circle cx="596" cy="74" r="6" fill="#28C840"/>
  <text x="835" y="79" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="12" fill="#94A3B8">~/hammadiqbal6</text>
  <line x1="530" y1="94" x2="1140" y2="94" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g>
      <text x="560" y="138" class="cmd">$ whoami</text>
      <text x="560" y="158" class="out">hammad iqbal</text>
    </g>
    <g>
      <text x="560" y="182" class="cmd">$ cat role.txt</text>
      <text x="560" y="202" class="out">Full-Stack &amp; CRM Developer</text>
    </g>
    <g>
      <text x="560" y="226" class="cmd">$ ls stack/</text>
      <text x="560" y="246" class="out">laravel  nextjs  react  react-native  node  mysql  mongodb</text>
    </g>
  <text x="560" y="272" class="cmd">$</text><rect class="cur" x="576" y="258" width="10" height="18" fill="#67E8F9" fill-opacity="0.9"/>
</svg>
