name: Profile assets

# Regenerates every dynamic profile asset (project cards with live repo facts,
# stats, activity sparkline + streaks, dev tip, last-updated stamp, 3D graph),
# publishes them to the `output` branch, and refreshes the README's
# <!--START_NOW--> / <!--START_SHIPPED--> sections on main when they change.
on:
  schedule:
    - cron: "15 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Dynamic cards and README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_dynamic.py "${{ github.repository_owner }}" dist --readme README.md

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect outputs
        run: |
          cp profile-3d-contrib/*.svg dist/
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed README sections
        run: |
          rm -rf profile-3d-contrib dist
          if git diff --quiet -- README.md; then
            echo "README sections unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh Now building / Recently shipped [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
